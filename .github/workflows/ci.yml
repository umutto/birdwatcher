name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docker_services: ${{ steps.docker-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Evaluate Path Filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            proto:
              - 'proto/**'
              - '.github/workflows/ci.yml'
            go:
              - 'services/catalog/**'
              - 'services/frontier/**'
              - 'services/scraper/**'
              - 'services/textparser/**'
              - 'shared/**'
              - 'gen/go/**'
              - 'go.work'
              - 'go.work.sum'
              - '**/go.mod'
              - '**/go.sum'
              - 'proto/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            python:
              - 'services/vision/**'
              - 'gen/python/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            catalog:
              - 'services/catalog/**'
              - 'shared/**'
              - 'gen/go/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            frontier:
              - 'services/frontier/**'
              - 'shared/**'
              - 'gen/go/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            scraper:
              - 'services/scraper/**'
              - 'shared/**'
              - 'gen/go/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            textparser:
              - 'services/textparser/**'
              - 'shared/**'
              - 'gen/go/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            vision:
              - 'services/vision/**'
              - 'gen/python/**'
              - '.github/workflows/ci.yml'

      - name: Determine Docker Services to Build
        id: docker-services
        run: |
          SERVICES=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] | select(. as $s | ["catalog", "frontier", "scraper", "textparser", "vision"] | index($s))]')
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  proto:
    name: Protobuf & Schemas
    needs: detect-changes
    if: needs.detect-changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint Protobuf
        run: |
          cd proto
          buf lint

      - name: Verify Code Generation Drift
        run: |
          cd proto
          buf generate
          cd ..
          git diff --exit-code gen/

  go:
    name: Go Lint & Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GO_MODULES: >-
        ./services/catalog/...
        ./services/frontier/...
        ./services/scraper/...
        ./services/textparser/...
        ./shared/logger/...
        ./shared/nats/...
        ./shared/telemetry/...
        ./gen/go/...
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Verify Workspace Sync
        run: |
          go work sync
          git diff --exit-code go.work.sum

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'

      - name: Verify sqlc Code Generation Drift
        run: |
          cd services/catalog
          sqlc compile
          sqlc generate
          cd ../..
          git diff --exit-code services/catalog/internal/repository/

      - name: Install sqruff
        uses: quarylabs/install-sqruff-cli-action@v0.1.0

      - name: Lint SQL (sqruff)
        run: sqruff lint services/catalog --format github-annotation-native

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --timeout=5m ${{ env.GO_MODULES }}

      - name: Run Unit Tests (go test)
        env:
          CGO_ENABLED: 1
        run: go test -race -cover -v ${{ env.GO_MODULES }}

  python:
    name: Python Lint & Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'services/vision/.python-version'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint & Format Check (Ruff)
        run: |
          cd services/vision
          uv run --with ruff ruff check .
          uv run --with ruff ruff format --check .

      - name: Run Unit Tests (Pytest)
        run: |
          cd services/vision
          uv run --with pytest pytest || [ $? -eq 5 ]

  web:
    name: Web Lint, Type-Check & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: 'web/package.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Lint (oxlint & eslint)
        run: |
          cd web
          pnpm lint

      - name: Format Check (oxfmt)
        run: |
          cd web
          pnpm format
          git diff --exit-code src/

      - name: Type-Check & Build (tsgo & vite)
        run: |
          cd web
          pnpm build

  docker-build:
    name: Docker Build (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.docker_services != '[]' && needs.detect-changes.outputs.docker_services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.docker_services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Dockerfile is populated
        id: check-dockerfile
        run: |
          if [ -s "services/${{ matrix.service }}/Dockerfile" ]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::services/${{ matrix.service }}/Dockerfile is currently empty. Skipping Docker build until populated."
          fi

      - name: Set up Docker Buildx
        if: steps.check-dockerfile.outputs.has_content == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Sanity Check)
        if: steps.check-dockerfile.outputs.has_content == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: CI Status Gatekeeper
    needs: [detect-changes, proto, go, python, web, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Results
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -E -q 'failure|cancelled'; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were legitimately skipped."
          exit 0
